<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spiral Particle Galaxy</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    #loading {
        position: fixed;
        inset: 0;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255,255,255,0.7);
        font-family: Arial, sans-serif;
        font-size: 12px;
        letter-spacing: 4px;
        z-index: 10;
        transition: opacity 1.5s ease;
    }
</style>
</head>

<body>

<div id="loading">ENTERING DEEP SPACE...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* ============================================================
   SETTINGS
============================================================ */

const PARTICLE_COUNT = 8500;
const STAR_COUNT = 1600;

const TOTAL_DURATION = 120;


/* ============================================================
   THREE.JS
============================================================ */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x000000);


const camera =
    new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );


camera.position.set(
    0,
    0,
    100
);


const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


document.body.appendChild(
    renderer.domElement
);


/* ============================================================
   LOADING
============================================================ */

setTimeout(() => {

    const loading =
        document.getElementById("loading");

    loading.style.opacity = "0";

    setTimeout(() => {
        loading.remove();
    }, 1500);

}, 1000);


/* ============================================================
   GALAXY GROUP
============================================================ */

const galaxy =
    new THREE.Group();

scene.add(galaxy);


/*
   FACE-ON VIEW

   Unlike the previous version,
   there is almost NO tilt here.

   This is important because the
   reference image is a clear
   top-down spiral.
*/


galaxy.rotation.x = 0;
galaxy.rotation.z = 0;


/* ============================================================
   PARTICLE ARRAYS
============================================================ */

const positions =
    new Float32Array(
        PARTICLE_COUNT * 3
    );


const galaxyTargets =
    new Float32Array(
        PARTICLE_COUNT * 3
    );


const startPositions =
    new Float32Array(
        PARTICLE_COUNT * 3
    );


const dissolveTargets =
    new Float32Array(
        PARTICLE_COUNT * 3
    );


const colors =
    new Float32Array(
        PARTICLE_COUNT * 3
    );


/* ============================================================
   GALAXY SHAPE
============================================================ */

/*
    THIS IS THE MOST IMPORTANT PART.

    Four strong spiral arms.

    The equation deliberately creates
    obvious long curved arms instead
    of a random circular cloud.
*/

const ARM_COUNT = 4;

const MAX_RADIUS = 40;


/* ============================================================
   PARTICLE CREATION
============================================================ */

for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
) {

    const index = i * 3;


    /* --------------------------------------------------------
       STARTING DEEP SPACE POSITION
    -------------------------------------------------------- */

    startPositions[index] =
        (Math.random() - 0.5) * 190;

    startPositions[index + 1] =
        (Math.random() - 0.5) * 110;

    startPositions[index + 2] =
        (Math.random() - 0.5) * 80;


    positions[index] =
        startPositions[index];

    positions[index + 1] =
        startPositions[index + 1];

    positions[index + 2] =
        startPositions[index + 2];


    /* --------------------------------------------------------
       RADIUS

       Keeps the center dense while allowing
       the spiral arms to stretch far outward.
    -------------------------------------------------------- */

    let radius;

    const random =
        Math.random();

    if (random < 0.42) {

        radius =
            Math.pow(
                Math.random(),
                1.65
            ) * MAX_RADIUS;

    } else {

        radius =
            Math.pow(
                Math.random(),
                0.82
            ) * MAX_RADIUS;
    }


    /* --------------------------------------------------------
       CHOOSE ONE OF FOUR ARMS
    -------------------------------------------------------- */

    const arm =
        Math.floor(
            Math.random() * ARM_COUNT
        );


    const armStart =
        arm *
        (Math.PI * 2 / ARM_COUNT);


    /* --------------------------------------------------------
       STRONG SPIRAL CURVE
    -------------------------------------------------------- */

    const spiralStrength =
        0.16;


    const spiralAngle =
        armStart +
        radius *
        spiralStrength;


    /* --------------------------------------------------------
       ARM WIDTH

       Tiny variation keeps it looking
       natural instead of perfectly mathematical.
    -------------------------------------------------------- */

    const armWidth =
        0.045 +
        radius * 0.010;


    const angle =
        spiralAngle +
        (Math.random() - 0.5) *
        armWidth;


    /* --------------------------------------------------------
       DISC POSITION
    -------------------------------------------------------- */

    let x =
        Math.cos(angle) *
        radius;


    let y =
        Math.sin(angle) *
        radius;


    /* --------------------------------------------------------
       NATURAL PARTICLE SCATTER
    -------------------------------------------------------- */

    const scatter =
        0.4 +
        radius * 0.025;


    x +=
        (Math.random() - 0.5) *
        scatter;


    y +=
        (Math.random() - 0.5) *
        scatter;


    /* --------------------------------------------------------
       Z THICKNESS

       Almost flat, like the reference.
    -------------------------------------------------------- */

    const z =
        (Math.random() - 0.5) *
        (
            0.3 +
            (1 - radius / MAX_RADIUS) * 2.0
        );


    /* --------------------------------------------------------
       EXTRA CENTRAL PARTICLES
    -------------------------------------------------------- */

    if (radius < 7) {

        x *= 0.75;
        y *= 0.75;
    }


    galaxyTargets[index] =
        x;

    galaxyTargets[index + 1] =
        y;

    galaxyTargets[index + 2] =
        z;


    /* --------------------------------------------------------
       DISSOLVE POSITION
    -------------------------------------------------------- */

    const expansion =
        1.8 +
        Math.random() * 2.5;


    dissolveTargets[index] =
        x * expansion +
        (Math.random() - 0.5) * 12;


    dissolveTargets[index + 1] =
        y * expansion +
        (Math.random() - 0.5) * 12;


    dissolveTargets[index + 2] =
        z +
        (Math.random() - 0.5) * 15;


    /* ========================================================
       COLOR

       Reference-like:
       yellow/orange center
       pink middle
       purple/red outer arms
    ======================================================== */

    const normalized =
        radius / MAX_RADIUS;


    let r;
    let g;
    let b;


    /* --------------------------------------------------------
       CENTER
    -------------------------------------------------------- */

    if (normalized < 0.15) {

        r =
            1.0;

        g =
            0.60 +
            Math.random() * 0.30;

        b =
            0.15 +
            Math.random() * 0.20;
    }


    /* --------------------------------------------------------
       INNER PINK / ORANGE
    -------------------------------------------------------- */

    else if (normalized < 0.38) {

        r =
            0.95 +
            Math.random() * 0.05;

        g =
            0.25 +
            Math.random() * 0.25;

        b =
            0.30 +
            Math.random() * 0.25;
    }


    /* --------------------------------------------------------
       PINK / MAGENTA ARMS
    -------------------------------------------------------- */

    else if (normalized < 0.68) {

        r =
            0.75 +
            Math.random() * 0.25;

        g =
            0.12 +
            Math.random() * 0.22;

        b =
            0.45 +
            Math.random() * 0.35;
    }


    /* --------------------------------------------------------
       OUTER PURPLE / RED
    -------------------------------------------------------- */

    else {

        r =
            0.48 +
            Math.random() * 0.35;

        g =
            0.08 +
            Math.random() * 0.18;

        b =
            0.40 +
            Math.random() * 0.45;
    }


    /* --------------------------------------------------------
       OCCASIONAL WHITE PARTICLES
    -------------------------------------------------------- */

    if (Math.random() < 0.075) {

        r = 1;
        g = 0.9;
        b = 0.9;
    }


    colors[index] =
        r;

    colors[index + 1] =
        g;

    colors[index + 2] =
        b;
}


/* ============================================================
   PARTICLE TEXTURE
============================================================ */

const textureCanvas =
    document.createElement(
        "canvas"
    );

textureCanvas.width = 64;
textureCanvas.height = 64;


const textureContext =
    textureCanvas.getContext(
        "2d"
    );


const gradient =
    textureContext.createRadialGradient(
        32,
        32,
        0,
        32,
        32,
        32
    );


gradient.addColorStop(
    0,
    "rgba(255,255,255,1)"
);


gradient.addColorStop(
    0.18,
    "rgba(255,255,255,0.9)"
);


gradient.addColorStop(
    0.45,
    "rgba(255,255,255,0.35)"
);


gradient.addColorStop(
    1,
    "rgba(255,255,255,0)"
);


textureContext.fillStyle =
    gradient;


textureContext.fillRect(
    0,
    0,
    64,
    64
);


const particleTexture =
    new THREE.CanvasTexture(
        textureCanvas
    );


/* ============================================================
   MAIN PARTICLES
============================================================ */

const geometry =
    new THREE.BufferGeometry();


geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);


geometry.setAttribute(
    "color",
    new THREE.BufferAttribute(
        colors,
        3
    )
);


const material =
    new THREE.PointsMaterial({

        map: particleTexture,

        size: 0.85,

        vertexColors: true,

        transparent: true,

        opacity: 0.95,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false,

        sizeAttenuation: true
    });


const particles =
    new THREE.Points(
        geometry,
        material
    );


galaxy.add(
    particles
);


/* ============================================================
   SOFT SECONDARY PARTICLES
============================================================ */

const glowPositions =
    new Float32Array(
        PARTICLE_COUNT * 3
    );


for (
    let i = 0;
    i < PARTICLE_COUNT;
    i++
) {

    const index = i * 3;

    glowPositions[index] =
        positions[index];

    glowPositions[index + 1] =
        positions[index + 1];

    glowPositions[index + 2] =
        positions[index + 2];
}


const glowGeometry =
    new THREE.BufferGeometry();


glowGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        glowPositions,
        3
    )
);


glowGeometry.setAttribute(
    "color",
    new THREE.BufferAttribute(
        colors,
        3
    )
);


const glowMaterial =
    new THREE.PointsMaterial({

        map: particleTexture,

        size: 2.0,

        vertexColors: true,

        transparent: true,

        opacity: 0.10,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false,

        sizeAttenuation: true
    });


const glowParticles =
    new THREE.Points(
        glowGeometry,
        glowMaterial
    );


galaxy.add(
    glowParticles
);


/* ============================================================
   SMALL GALAXY CORE
============================================================ */

const coreMaterial =
    new THREE.SpriteMaterial({

        map: particleTexture,

        color: 0xffc56a,

        transparent: true,

        opacity: 0,

        blending:
            THREE.AdditiveBlending,

        depthWrite: false
    });


const core =
    new THREE.Sprite(
        coreMaterial
    );


core.scale.set(
    10,
    10,
    1
);


galaxy.add(
    core
);


/* ============================================================
   BACKGROUND STARS
============================================================ */

const starPositions =
    new Float32Array(
        STAR_COUNT * 3
    );


for (
    let i = 0;
    i < STAR_COUNT;
    i++
) {

    const index = i * 3;

    starPositions[index] =
        (Math.random() - 0.5) * 400;

    starPositions[index + 1] =
        (Math.random() - 0.5) * 240;

    starPositions[index + 2] =
        (Math.random() - 0.5) * 120;
}


const starGeometry =
    new THREE.BufferGeometry();


starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        starPositions,
        3
    )
);


const starMaterial =
    new THREE.PointsMaterial({

        map: particleTexture,

        color: 0xffffff,

        size: 0.45,

        transparent: true,

        opacity: 0.55,

        depthWrite: false,

        blending:
            THREE.AdditiveBlending
    });


const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );


scene.add(
    stars
);


/* ============================================================
   EASING
============================================================ */

function smooth(t) {

    t =
        Math.max(
            0,
            Math.min(1, t)
        );

    return (
        t * t *
        (3 - 2 * t)
    );
}


function smoother(t) {

    t =
        Math.max(
            0,
            Math.min(1, t)
        );

    return (
        t * t * t *
        (t * (t * 6 - 15) + 10)
    );
}


/* ============================================================
   ANIMATION CLOCK
============================================================ */

const clock =
    new THREE.Clock();

let elapsed = 0;


/* ============================================================
   ANIMATION
============================================================ */

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();

    elapsed += delta;


    const time =
        elapsed %
        TOTAL_DURATION;


    /* ========================================================
       PHASE 1
       0 - 25 SEC
       RANDOM SPACE
    ======================================================== */

    if (time < 25) {

        const t =
            time / 25;


        /*
           Very slight preparation
           toward the spiral.
        */

        const prepare =
            smooth(
                Math.max(
                    0,
                    (t - 0.55) /
                    0.45
                )
            );


        for (
            let i = 0;
            i < PARTICLE_COUNT;
            i++
        ) {

            const index = i * 3;


            positions[index] =
                THREE.MathUtils.lerp(
                    startPositions[index],
                    galaxyTargets[index],
                    prepare * 0.025
                );


            positions[index + 1] =
                THREE.MathUtils.lerp(
                    startPositions[index + 1],
                    galaxyTargets[index + 1],
                    prepare * 0.025
                );


            positions[index + 2] =
                THREE.MathUtils.lerp(
                    startPositions[index + 2],
                    galaxyTargets[index + 2],
                    prepare * 0.025
                );
        }


        material.opacity =
            0.68;

        glowMaterial.opacity =
            0.035;

        coreMaterial.opacity =
            0;
    }


    /* ========================================================
       PHASE 2
       25 - 65 SEC
       SPIRAL FORMS
    ======================================================== */

    else if (time < 65) {

        const t =
            (time - 25) / 40;


        const formation =
            smoother(t);


        for (
            let i = 0;
            i < PARTICLE_COUNT;
            i++
        ) {

            const index = i * 3;


            /*
               Smooth gathering
            */

            positions[index] =
                THREE.MathUtils.lerp(
                    startPositions[index],
                    galaxyTargets[index],
                    formation
                );


            positions[index + 1] =
                THREE.MathUtils.lerp(
                    startPositions[index + 1],
                    galaxyTargets[index + 1],
                    formation
                );


            positions[index + 2] =
                THREE.MathUtils.lerp(
                    startPositions[index + 2],
                    galaxyTargets[index + 2],
                    formation
                );
        }


        material.opacity =
            0.65 +
            formation * 0.30;


        glowMaterial.opacity =
            0.04 +
            formation * 0.08;


        coreMaterial.opacity =
            formation * 0.55;
    }


    /* ========================================================
       PHASE 3
       65 - 100 SEC
       FULL GALAXY
    ======================================================== */

    else if (time < 100) {

        const t =
            (time - 65) / 35;


        /*
           One slow complete rotation.
        */

        galaxy.rotation.z =
            t *
            Math.PI *
            2;


        /*
           Keep the galaxy perfectly
           face-on while rotating.
        */

        galaxy.rotation.x = 0;


        for (
            let i = 0;
            i < PARTICLE_COUNT;
            i++
        ) {

            const index = i * 3;

            positions[index] =
                galaxyTargets[index];

            positions[index + 1] =
                galaxyTargets[index + 1];

            positions[index + 2] =
                galaxyTargets[index + 2];
        }


        /*
           Subtle core breathing
        */

        const pulse =
            10 +
            Math.sin(
                elapsed * 0.7
            ) * 0.6;


        core.scale.set(
            pulse,
            pulse,
            1
        );


        material.opacity =
            0.97;

        glowMaterial.opacity =
            0.115;

        coreMaterial.opacity =
            0.58;
    }


    /* ========================================================
       PHASE 4
       100 - 112 SEC
       DISSOLVE
    ======================================================== */

    else if (time < 112) {

        const t =
            (time - 100) / 12;


        const dissolve =
            smoother(t);


        galaxy.rotation.z =
            Math.PI * 2 +
            dissolve * 0.15;


        for (
            let i = 0;
            i < PARTICLE_COUNT;
            i++
        ) {

            const index = i * 3;


            positions[index] =
                THREE.MathUtils.lerp(
                    galaxyTargets[index],
                    dissolveTargets[index],
                    dissolve
                );


            positions[index + 1] =
                THREE.MathUtils.lerp(
                    galaxyTargets[index + 1],
                    dissolveTargets[index + 1],
                    dissolve
                );


            positions[index + 2] =
                THREE.MathUtils.lerp(
                    galaxyTargets[index + 2],
                    dissolveTargets[index + 2],
                    dissolve
                );
        }


        material.opacity =
            0.97 *
            (1 - dissolve);


        glowMaterial.opacity =
            0.11 *
            (1 - dissolve);


        coreMaterial.opacity =
            0.58 *
            (1 - dissolve);
    }


    /* ========================================================
       PHASE 5
       112 - 120 SEC
       RETURN TO SPACE
    ======================================================== */

    else {

        const t =
            (time - 112) / 8;


        const returnAmount =
            smoother(t);


        for (
            let i = 0;
            i < PARTICLE_COUNT;
            i++
        ) {

            const index = i * 3;


            positions[index] =
                THREE.MathUtils.lerp(
                    dissolveTargets[index],
                    startPositions[index],
                    returnAmount
                );


            positions[index + 1] =
                THREE.MathUtils.lerp(
                    dissolveTargets[index + 1],
                    startPositions[index + 1],
                    returnAmount
                );


            positions[index + 2] =
                THREE.MathUtils.lerp(
                    dissolveTargets[index + 2],
                    startPositions[index + 2],
                    returnAmount
                );
        }


        material.opacity =
            0.30 *
            (1 - returnAmount);


        glowMaterial.opacity =
            0.035 *
            (1 - returnAmount);


        coreMaterial.opacity =
            0.18 *
            (1 - returnAmount);


        galaxy.rotation.z =
            THREE.MathUtils.lerp(
                Math.PI * 2,
                0,
                returnAmount
            );
    }


    /* ========================================================
       UPDATE PARTICLES
    ======================================================== */

    geometry.attributes
        .position
        .needsUpdate = true;


    for (
        let i = 0;
        i < PARTICLE_COUNT;
        i++
    ) {

        const index = i * 3;

        glowPositions[index] =
            positions[index];

        glowPositions[index + 1] =
            positions[index + 1];

        glowPositions[index + 2] =
            positions[index + 2];
    }


    glowGeometry.attributes
        .position
        .needsUpdate = true;


    /* ========================================================
       BACKGROUND STAR MOVEMENT
    ======================================================== */

    stars.rotation.z +=
        0.000025;


    stars.rotation.y +=
        0.00001;


    /* ========================================================
       VERY SUBTLE CAMERA MOVEMENT
    ======================================================== */

    camera.position.x =
        Math.sin(
            elapsed * 0.035
        ) * 1.2;


    camera.position.y =
        Math.cos(
            elapsed * 0.03
        ) * 0.7;


    camera.lookAt(
        0,
        0,
        0
    );


    /* ========================================================
       RENDER
    ======================================================== */

    renderer.render(
        scene,
        camera
    );
}


animate();


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
```
